<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Abrindo Pulso Operacional…</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f7f8;color:#17324d;font:16px Segoe UI,Arial}.box{text-align:center;background:white;padding:32px;border-radius:20px;box-shadow:0 16px 50px #16334d1a}.dot{width:42px;height:42px;margin:auto;border:4px solid #dcebea;border-top-color:#0f8b8d;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{display:block;color:#71879a;margin-top:8px}.error{color:#b94741}</style></head><body><main class="box"><div class="dot"></div><h2>Abrindo o Pulso Operacional</h2><small id="status">Conectando ao servidor seguro…</small></main><script>fetch('https://raw.githubusercontent.com/presentesaicorporativo-beep/pulso-operacional-acesso/main/target.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(x=>location.replace(x.url)).catch(()=>{document.querySelector('.dot').style.display='none';const s=document.querySelector('#status');s.className='error';s.textContent='O servidor está temporariamente indisponível. Tente novamente em alguns minutos.'});</script></body></html>
